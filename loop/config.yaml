# Loop inputs (PLAN §5). Stop rule: all targets PASS or wall clock past `deadline`.
# Money is budget.yaml's law (C13-C16): every bench/smoke cell first runs `bench/run.py ... --dry-run` (budget gate);
# a refused cell is skipped and logged, never launched.
deadline: "2026-11-08T22:00:00+01:00"   # feature freeze, CET
bench: mad
headline_model: gpt-oss:120b          # C13
# each cell runs once per attack, sequentially: `none` = benign utility, the other = ASR.
# (concurrent attacks in one logdir would interleave run.py's events-<suite>.jsonl)
attacks: [none, important_instructions]
suites: [workspace, banking, slack, travel]
# Ollama pay-as-you-go = 3 concurrent requests per key -> 2 suite processes per key
ollama_keys:
  A: [workspace, banking]
  B: [slack, travel]
smoke:                                # PLAN §5 stage 2: 1 user task x 1 injection task per suite
  model: gpt-oss:20b
  configs: [NONE, ADAPTIVE_RULES, ADAPTIVE]   # ADAPTIVE added 09:30 CET: swarmguard-decider:v2 served + calibrated (C22)
  n: 1
  inj: injection_task_0               # first injection task id (exists in all 4 suites)
# Lanes = budget.yaml priority. Lanes run concurrently (one thread each); within a lane items/configs run in order
# (NONE -> STATIC -> ADAPTIVE_RULES -> ADAPTIVE); within a config the suites run as parallel processes.
# Item keys: model, configs, suites (default all), attacks (default `attacks`), max_episodes, only_if_remaining_usd_gt.
lanes:
  ollama:
    - {model: gpt-oss:120b, configs: [NONE, STATIC, ADAPTIVE_RULES, ADAPTIVE]}   # headline
    - {model: gpt-oss:20b,  configs: [NONE, STATIC, ADAPTIVE_RULES, ADAPTIVE]}   # dumb tier
  commandcode:
    - {model: deepseek/deepseek-v4.1-flash, configs: [NONE, STATIC, ADAPTIVE_RULES, ADAPTIVE]}  # smart-1M tier
  openrouter:                         # gpt-4.1 paper anchor (C16), cap $9.5. NONE is on disk
    # (runs/mad/NONE/gpt-4.1, pipeline openai-compatible-multi-agent, partial) and is never re-run.
    - {model: openai/gpt-4.1, configs: [ADAPTIVE], suites: [workspace, banking], attacks: [none]}
    - {model: openai/gpt-4.1, configs: [ADAPTIVE], suites: [workspace], attacks: [important_instructions], max_episodes: 100}
    - {model: openai/gpt-4.1, configs: [STATIC], suites: [workspace, banking], attacks: [none], only_if_remaining_usd_gt: 3}
# stage 6 harvest: FN/FP windows + train.from_mad_runs over these configs -> train/rows_iter_N_mad.jsonl (PLAN §8a item 1)
harvest:
  mad_configs: [NONE, STATIC, ADAPTIVE_RULES]
# stage 7 retrain (decider v3, PLAN §8a): dataset = train.merge_v3 (v2 + harvested + synth) on the Mac; box steps =
# train/data_v3/BOX_COMMANDS.md a-c (push, train, export), printed with the new tag and executed by the orchestrator over ssh (C8);
# calibrate = train/eval.py on val (+ held-out tests) against $SG_DECIDER_HOST -> loop/iter_N/risk_map.yaml.
decider:
  version: 2                          # tag served now (swarmguard-decider:v2); retrain builds v{version+1}.
                                      # Orchestrator bumps this once the new tag is served + calibrated.
  host_env: SG_DECIDER_HOST           # env var holding the served decider endpoint (http://<box>:11434/v1)
  base: ninty-seven/StepGuard         # decided C20 (PLAN §8a item 4, BOX_COMMANDS.md b); fallback Qwen/Qwen3-4B-Instruct-2507 if it fails to load / breaks ChatML
  box_commands: train/data_v3/BOX_COMMANDS.md
synth:                                # teacher rows (train/synth_teacher.py, Command Code); the loop never calls the teacher
  enabled: true
  budget_usd: 1
  rows: data_v3/synth_rows.jsonl      # relative to --train-dir
calibration:
  # ponytail: documents train/eval.py's hard-coded calibration (FPR <= 2% -> risk 6.0 ATTENUATE, <= 1% -> 8.0 KILL)
  fpr_targets: {attenuate: 0.02, kill: 0.01}
  val_limit: 0                        # 0 = whole val split
  test_limit: 150                     # rows per held-out split (stride sample); 300 -> 150 at C23 (GPU shared with training + bench)
