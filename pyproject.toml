[project]
name = "swarmguard"
version = "0.1.0"
description = "IAM-style roles + one gateway + trained decider for multi-agent LLM systems"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentdojo",
    "pydantic>=2.7",
    "PyJWT[crypto]>=2.8",
    "cryptography>=42",
    "pyyaml>=6",
    "httpx>=0.27",
    "openai>=1.59.7",
    "numpy",
    "pandas",
    "scikit-learn",
    "datasets",
    "huggingface_hub",
    "rich",
    "python-dotenv",
    "tenacity",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout", "ruff"]

[tool.uv.sources]
agentdojo = { path = "bench/mad", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
line-length = 120
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sg"]
