# SwarmGuard money law (PLAN.md C13). Orchestrator-owned. loop/ reads this before any full run.
providers:
  ollama:
    base_url: https://ollama.com/v1
    cap_usd_total: 58          # ~$58 across both keys (user, 06:20 CET Nov 8)
    reserve_usd: 8             # never spend below this remaining
    max_concurrent_per_key: 3  # pay-as-you-go limit → 2 suites per key
    keys:
      A: OLLAMA_API_KEY        # env
      B: OLLAMA_API_KEY1       # ~/.zshrc only; export before use
  commandcode:                 # C14 (≈05:55 CET): commandcode.ai GOAT plan
    base_url: https://api.commandcode.ai/provider/v1   # /chat/completions (OpenAI) · /messages (Anthropic, x-api-key)
    key_env: COMMAND_CODE_API  # value in ~/.zshrc; session env may be stale -> re-read from rc
    window_5h_usd: 20
    window_7d_usd: 50
    month_usd: 100             # the gate uses month_usd as the total cap for commandcode (no separate cap key)
    reserve_usd: 5
    max_concurrent: 3          # assumed ("Standard" rate limits); back off on 429
    not_in_plan: [gpt-5.5, claude-fable-5, claude-opus-*]
    # gate semantics (bench/budget.py): cap = month_usd − spent − reserve_usd, plus the 5 h and 7 d rolling windows
    # deepseek-v4.1-flash measured 07:24: ≈ 19.5k prompt + 4.3k completion tokens per episode (≈ $0.0055)
  openrouter:                  # C16 (≈06:25 CET): user topped up $10
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY   # ~/.zshrc (session env stale)
    cap_usd: 11.9              # C28 (17:55 CET): user reports $4.36 real balance with ledger spend 7.84 -> cap = 7.84 + 4.36 - 0.3 slack; no reserve on top
    allowed_models: [openai/gpt-4.1]
    purpose: paper anchor only
  anthropic:                   # C17: key arrives ≈13:00-14:00 CET; gate = key present AND allowed
    base_url: https://api.anthropic.com/v1   # OpenAI-compat layer (/v1/chat/completions; strict ignored, no caching)
    key_env: ANTHROPIC_API_KEY  # ~/.zshrc; absent until the user adds it
    cap_usd: 95
    reserve_usd: 5
    allowed_models: [claude-sonnet-5-5, claude-opus-5-5, claude-haiku-5-5]   # NOT fable
    max_concurrent: 4
  groq:
    allowed: false             # C15: key capped at 8,000 tokens/min -> unusable
  openai:
    allowed: false             # ~$2-3 credit left; never call
# prices USD per 1M tokens from ollama.com/pricing (input; output assumed ~4x input until measured)
prices:
  gpt-oss:20b:      {input: 0.07, output_est: 0.30}
  gpt-oss:120b:     {input: 0.15, output_est: 0.60}
  deepseek-v4-pro:  {input: 0.66, output_est: 2.60, note: off-peak price, all weekend}
  # Command Code (commandcode.ai/docs/resources/pricing-limits, per 1M tokens)
  deepseek/deepseek-v4.1-flash: {input: 0.15, output: 0.60, provider: commandcode}
  # claude-haiku-5-5: runs through Anthropic's OpenAI-compat layer (C17); price assumed, not in priority
  claude-haiku-5-5:             {input: 1.00, output: 5.00, provider: anthropic}
  # Anthropic (C17; list prices assumed until the key arrives - verify)
  claude-sonnet-5-5:            {input: 3.00, output: 15.00, provider: anthropic, note: strong-model anchor}
  claude-opus-5-5:              {input: 15.00, output: 75.00, provider: anthropic, note: only if >= $40 left after Sonnet}
  # Command Code strong open model (C18)
  moonshotai/Kimi-K3.1-Pro:     {input: 2.00, output: 10.00, provider: commandcode}
  # OpenRouter
  openai/gpt-4.1:               {input: 2.00, output: 8.00, provider: openrouter, note: paper anchor}
# measured 06:40 on gpt-oss:20b smoke + 120b run (≈7 s/episode): ~6-7k tokens per injected episode, ~6k per benign; projection uses 8k
# spend priority = run order; each row only after the previous is complete and the gate passes
priority:
  - {model: gpt-oss:120b,   configs: [NONE, STATIC, ADAPTIVE_RULES, ADAPTIVE], suites: all, role: headline}
  - {model: gpt-oss:20b,    configs: [NONE, STATIC, ADAPTIVE_RULES, ADAPTIVE], suites: all, role: dumb tier}
  # Command Code lane (independent of Ollama; obey 5h/7d windows)
  - {provider: commandcode, model: deepseek/deepseek-v4.1-flash, configs: [NONE, STATIC, ADAPTIVE_RULES, ADAPTIVE], suites: all, role: smart 1M tier}
  # claude-haiku-5-5 dropped (P1-end): fork pipeline only speaks OpenAI /chat/completions; run.py refuses it
  # Command Code strong open model (C18): banking first, workspace only if the 7d window allows
  # C21: cells = bench/cells_kimi_cc.txt (banking; workspace lines commented until the 7d window has > $30)
  - {provider: commandcode, model: moonshotai/Kimi-K3.1-Pro, configs: [NONE, ADAPTIVE], suites: [banking], role: strong open model}
  - {provider: commandcode, model: moonshotai/Kimi-K3.1-Pro, configs: [NONE, ADAPTIVE], suites: [workspace], role: strong open model, only_if_window_7d_remaining_usd_gt: 30}
  # Anthropic lane (C17): starts when ANTHROPIC_API_KEY exists; Sonnet first
  # C21: cells = bench/cells_anthropic.txt (≈700 episodes ≈ $63 real at ~$0.09/ep; the gate projects 8k tok/ep ≈ $0.048 until 3 measured rows exist)
  - {provider: anthropic, model: claude-sonnet-5-5, configs: [NONE, ADAPTIVE], suites: [workspace, banking], role: strong-model anchor (utility-cost vs multi-CaMeL Fable 5 row)}
  - {provider: anthropic, model: claude-opus-5-5, configs: [NONE, ADAPTIVE], suites: [banking], only_if_remaining_usd_gt: 40}
  # OpenRouter lane: gpt-4.1 paper anchor (C16), cap $9.5 total
  - {provider: openrouter, model: openai/gpt-4.1, configs: [NONE], note: already on disk (runs/mad/NONE/gpt-4.1, partial 329 episodes) - never extended}
  - {provider: openrouter, model: openai/gpt-4.1, configs: [ADAPTIVE], suites: [workspace, banking], attack: none, role: anchor utility}
  - {provider: openrouter, model: openai/gpt-4.1, configs: [ADAPTIVE], suites: [workspace], attack: important_instructions, n_episodes: 100, role: anchor ASR sample}
  - {provider: openrouter, model: openai/gpt-4.1, configs: [STATIC], suites: [workspace, banking], attack: none, only_if_remaining_usd_gt: 3}
  - {provider: ollama, model: deepseek-v4-pro, configs: [], note: dropped - smart tier moved to Command Code}
monitors:
  smoke_model: gpt-oss:20b
  llm_monitor_model: gpt-oss:20b      # until swarmguard-decider is served
  teacher_model: gpt-oss:120b         # ~500 teacher rows max
partial_baselines:
  - {path: runs/mad/NONE/gpt-4.1, model: gpt-4.1, status: partial, episodes: 329, note: recorded before C13; never extended}
